services:

  backend:
    build:
      context: backend
      target: ${BUILD_TARGET:-dev}
    environment:
      PORT: 8000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "8000:8000"
    # Hot reload through Compose Watch (`make dev`) instead of bind mounts:
    # it copies changed files into the container, so it works on any drive.
    develop:
      watch:
        - action: sync
          path: ./backend/src
          target: /app/src
        - action: sync
          path: ./backend/test
          target: /app/test
        - action: rebuild
          path: ./backend/package.json
        - action: rebuild
          path: ./backend/pnpm-lock.yaml
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/healthcheck"]
      interval: 4s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: frontend
      target: ${BUILD_TARGET:-dev}
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # Read by the browser, so it is the host-side URL, not http://backend:8000.
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    develop:
      watch:
        - action: sync
          path: ./frontend/src
          target: /app/src
        - action: sync
          path: ./frontend/public
          target: /app/public
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/pnpm-lock.yaml
